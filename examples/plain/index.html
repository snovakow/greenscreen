<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Greenscreen in plain JavaScript</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 24px;
        /* A checkerboard, so what the key takes out shows */
        background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px;
      }
      canvas {
        width: 320px;
        image-rendering: pixelated;
      }
    </style>
  </head>
  <body>
    <h1>Greenscreen in plain JavaScript</h1>
    <p>An ES module, with no build step. The import map gives the package's name a file to load; once it's published,
      a CDN's URL for the package does the same.</p>
    <script type="importmap">
      { "imports": { "@snovakow/greenscreen": "./node_modules/@snovakow/greenscreen/dist/index.js" } }
    </script>
    <script type="module">
      import { Greenscreen } from '@snovakow/greenscreen'

      // A picture to key: green, with a red square in the middle. A <video> playing a camera works the same way
      const picture = document.createElement('canvas')
      picture.width = 160
      picture.height = 120
      const context = picture.getContext('2d')
      context.fillStyle = 'rgb(40 190 60)'
      context.fillRect(0, 0, 160, 120)
      context.fillStyle = 'rgb(220 30 30)'
      context.fillRect(60, 40, 40, 40)

      // Green is keyed out by default. start() renders on every frame; call render() from your own loop instead
      const keyer = new Greenscreen(picture)
      keyer.canvas.id = 'keyed'
      document.body.append(keyer.canvas)
      keyer.start()
    </script>
  </body>
</html>
